<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tekken 8 · Match Detail</title><style>:root{font-family:system-ui,Arial;background:#080d1d;color:#eff4ff}*{box-sizing:border-box}body{margin:0}.top{background:#101831;border-bottom:1px solid #303d5c;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.top strong{font-size:17px}.back{background:#263451;color:white;border:1px solid #496184;border-radius:8px;padding:9px 12px;text-decoration:none}main{max-width:760px;margin:25px auto;padding:0 15px}h1{font-size:21px}.muted{color:#9baed1}.card{border:1px solid #3a4869;border-radius:14px;background:#151d32;padding:16px;margin-top:15px}.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.tag{border-radius:6px;padding:5px 9px;background:#304060;font-size:12px}.live{background:#bb2036;color:white;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}.result{display:grid;grid-template-columns:minmax(110px,1fr) repeat(var(--rounds),minmax(30px,48px)) 48px;align-items:center;gap:6px;min-width:0}.cell{padding:12px 2px;background:#222e4a;border:1px solid #394a6c;text-align:center;border-radius:6px}.label{font-size:11px;color:#a4b6d7;text-align:center}.name{display:flex;gap:9px;align-items:center;min-width:0}.name img{width:35px;height:35px;border-radius:8px;object-fit:cover;background:#263956}.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.winner{background:#25825c;color:#fff;font-weight:bold}h2{font-size:14px;color:#b4cafa;margin-top:25px}.status{font-size:13px;color:#a5b4d2}@media(max-width:540px){.card{padding:9px}.result{gap:4px;grid-template-columns:minmax(80px,1fr) repeat(var(--rounds),minmax(24px,1fr)) 39px}.cell{padding:10px 1px;font-size:12px}.name{gap:5px;font-size:12px}.name img{height:26px;width:26px}}</style></head><body><header class="top"><strong>TEKKEN 8 / MATCH DETAIL</strong><a class="bac
